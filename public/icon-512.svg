<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="180" stroke="url(#gold)" stroke-width="16" fill="none" opacity="0.4" />
  <circle cx="256" cy="256" r="130" stroke="url(#gold)" stroke-width="12" fill="none" opacity="0.6" stroke-dasharray="16 12" />
  <!-- Pulse radar wave -->
  <path d="M160 256h40l25-50 45 100 35-70 20 20h47" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Breaking news pulse dot -->
  <circle cx="372" cy="256" r="16" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <!-- Arabic Stylized Letter / News Icon -->
  <circle cx="256" cy="110" r="14" fill="#ef4444" />
</svg>
